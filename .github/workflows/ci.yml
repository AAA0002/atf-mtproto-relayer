name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax & Compilation Validation
        run: |
          python -m py_compile main.py
          echo "✅ Python syntax and compilation check passed."

      - name: Smoke Test FastAPI App
        run: |
          python -c "from main import app; print('✅ FastAPI App imported successfully:', app.title)"
